<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="220"/>
    </clipPath>
    <linearGradient id="glass-body" x1="6%" y1="3%" x2="94%" y2="100%">
      <stop stop-color="#4A496F" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#202B48" stop-opacity=".92"/>
      <stop offset="1" stop-color="#10233D" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="glass-refraction" x1="8%" y1="2%" x2="92%" y2="100%">
      <stop stop-color="#A28CFF" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#6677FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4DBDFF" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glass-bloom" cx="13%" cy="4%" r="88%">
      <stop stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset=".24" stop-color="#C8C2FF" stop-opacity=".15"/>
      <stop offset=".62" stop-color="#7D6EF2" stop-opacity=".035"/>
      <stop offset="1" stop-color="#7D6EF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass-blue-glow" cx="100%" cy="100%" r="74%">
      <stop stop-color="#42C9FF" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#42C9FF" stop-opacity=".035"/>
      <stop offset="1" stop-color="#42C9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-border" x1="3%" y1="2%" x2="97%" y2="100%">
      <stop stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset=".18" stop-color="#D5CEFF" stop-opacity=".62"/>
      <stop offset=".52" stop-color="#8B7BFF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#70D6FF" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient
      id="wand-stroke"
      x1="0"
      y1="0"
      x2="24"
      y2="24"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#E6E0FF"/>
      <stop offset=".46" stop-color="#B9ACFF"/>
      <stop offset="1" stop-color="#9A8AFF"/>
    </linearGradient>
    <filter id="tile-depth" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#030713" flood-opacity=".32"/>
    </filter>
    <filter id="wand-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#A995FF" flood-opacity=".42"/>
    </filter>
  </defs>

  <!-- Nearly full-canvas tile so the 32px Windows taskbar icon remains visually full-sized. -->
  <rect
    x="32"
    y="32"
    width="960"
    height="960"
    rx="220"
    fill="#10182C"
    fill-opacity=".9"
    filter="url(#tile-depth)"
  />
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#glass-body)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#glass-refraction)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#glass-bloom)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#glass-blue-glow)"/>

  <path
    d="M70 284C94 114 186 61 354 52H797C883 55 941 90 969 151C738 98 369 100 70 284Z"
    fill="#FFFFFF"
    fill-opacity=".09"
    clip-path="url(#tile)"
  />
  <path
    d="M77 158C119 86 190 58 298 53"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity=".44"
    stroke-width="18"
    stroke-linecap="round"
    clip-path="url(#tile)"
  />
  <path
    d="M618 992C790 970 917 875 992 706V992Z"
    fill="#5EC9FF"
    fill-opacity=".055"
    clip-path="url(#tile)"
  />

  <rect
    x="43"
    y="43"
    width="938"
    height="938"
    rx="209"
    fill="none"
    stroke="url(#glass-border)"
    stroke-width="22"
  />
  <rect
    x="59"
    y="59"
    width="906"
    height="906"
    rx="194"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity=".13"
    stroke-width="5"
  />

  <g
    transform="translate(218.667 218.667) scale(24.4444)"
    fill="none"
    stroke="url(#wand-stroke)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#wand-glow)"
  >
    <path d="m21.64 3.64-1.28-1.28a1.25 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/>
    <path d="m14 7 3 3"/>
    <path d="M5 6v4"/>
    <path d="M19 14v4"/>
    <path d="M10 2v2"/>
    <path d="M7 8H3"/>
    <path d="M21 16h-4"/>
    <path d="M11 3H9"/>
  </g>
</svg>
