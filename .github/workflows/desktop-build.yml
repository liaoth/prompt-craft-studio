name: Build desktop clients

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifacts: |
              release/*.exe
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-craft-studio-${{ runner.os }}-x64
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
