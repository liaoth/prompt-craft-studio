name: Build desktop clients

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifacts: |
              release/*.exe
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-craft-studio-${{ runner.os }}-x64
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prompt-craft-studio-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Download

          - Windows x64: use the `setup.exe` installer, or the optional `portable.exe`.
          - Linux x64: use the `.AppImage` on most distributions, or the `.deb` package on Debian/Ubuntu.
          - `SHA256SUMS.txt` contains checksums for every package.

          The Windows packages are currently unsigned and may show a SmartScreen warning.
          No account, Docker, Node.js, or environment variables are required after installation.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Prompt Craft Studio $version" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag
