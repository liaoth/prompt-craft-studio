name: prompt-craft

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promptforge}
      POSTGRES_USER: ${POSTGRES_USER:-promptforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptforge} -d ${POSTGRES_DB:-promptforge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [private]

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env using a URL-encoded password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env using a URL-encoded password}
      SITE_AI_PROVIDER: ${SITE_AI_PROVIDER:-}
      SITE_AI_MODEL: ${SITE_AI_MODEL:-}
      SITE_AI_API_KEY: ${SITE_AI_API_KEY:-}
      SITE_AI_ENDPOINT: ${SITE_AI_ENDPOINT:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [private]

volumes:
  postgres-data:

networks:
  private:
    driver: bridge
